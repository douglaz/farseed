[package]
name = "tau-relay"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
getrandom = "0.4"
hex = "0.4"
k256 = { version = "0.13", default-features = false, features = ["schnorr"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync", "io-util", "signal"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake", "connect"] }
toml = "1"
idna = "0.5"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
